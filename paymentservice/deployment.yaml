apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  labels:
    app: paymentservice
spec:
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      serviceAccountName: paymentservice
      containers:
        - name: server
          image: us-central1-docker.pkg.dev/google-samples/microservices-demo/paymentservice:v0.10.2
          ports:
          - containerPort: 50051
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 20
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 20
          env:
          - name: DISABLE_PROFILER
            value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 40Mi
            limits:
              cpu: 100m
              memory: 100Mi
